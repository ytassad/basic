<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MangaKey Pro</title>

<style>
body {
  background:black;
  color:#00ff00;
  font-family:monospace;
  font-size:12px;
  margin:0;
}

.header {
  text-align:center;
  border-bottom:1px solid #00ff00;
  padding:5px;
}

ul { list-style:none; padding:0; margin:0; }
li { padding:6px; }

.active {
  background:#00ff00;
  color:black;
}

.footer {
  position:fixed;
  bottom:0;
  width:100%;
  font-size:10px;
  border-top:1px solid #00ff00;
  background:black;
}

input {
  width:95%;
  background:black;
  color:#00ff00;
  border:1px solid #00ff00;
}
</style>
</head>

<body>

<div class="header" id="title">MangaKey Pro</div>

<ul id="list"></ul>

<div id="searchBox" style="display:none; padding:5px;">
  <input id="searchInput" placeholder="Search...">
</div>

<div class="footer" id="footer">
↑↓ | OK | 2⭐ | 5🔍 | 8+
</div>

<script>

// 🔥 STATE
let mode="list";
let index=0;
let items=[];
let currentChapters=[];
let pages=[];
let pageIndex=0;

// ⭐ FAVORITES
let favorites = JSON.parse(localStorage.getItem("fav") || "[]");

function saveFav(){
  localStorage.setItem("fav", JSON.stringify(favorites));
}

// ⚡ CACHE
let cache = JSON.parse(localStorage.getItem("cache") || "{}");

function saveCache(){
  localStorage.setItem("cache", JSON.stringify(cache));
}

// 🔥 LOAD MANGA
function loadHome(){
  if(cache.home){
    items=cache.home;
    renderList();
    return;
  }

  fetch("https://api.mangadex.org/manga?limit=10")
  .then(res=>res.json())
  .then(data=>{
    items=data.data.map(m=>({
      id:m.id,
      title:m.attributes.title.en || "No title"
    }));
    cache.home=items;
    saveCache();
    renderList();
  });
}

loadHome();

// 🔎 SEARCH
function searchManga(q){
  if(cache[q]){
    items=cache[q];
    renderList();
    return;
  }

  fetch("https://api.mangadex.org/manga?title="+q+"&limit=10")
  .then(res=>res.json())
  .then(data=>{
    items=data.data.map(m=>({
      id:m.id,
      title:m.attributes.title.en || "No title"
    }));
    cache[q]=items;
    saveCache();
    renderList();
  });
}

// ⭐ ADD FAVORITE
function addFav(){
  let m=items[index];
  if(!favorites.find(f=>f.id===m.id)){
    favorites.push(m);
    saveFav();
    alert("Added ⭐");
  }
}

// ⭐ SHOW FAVORITES
function showFav(){
  items=favorites;
  index=0;
  mode="list";
  renderList();
  document.getElementById("title").textContent="Favorites";
}

// 📚 CHAPTERS
function loadChapters(id){
  fetch("https://api.mangadex.org/chapter?manga="+id+"&limit=10&translatedLanguage[]=en")
  .then(r=>r.json())
  .then(data=>{
    currentChapters=data.data;
    index=0;
    mode="chapters";
    renderChapters();
  });
}

function renderChapters(){
  let list=document.getElementById("list");
  list.innerHTML="";
  currentChapters.forEach((c,i)=>{
    let li=document.createElement("li");
    li.textContent="Ch "+(c.attributes.chapter||"?");
    if(i===index) li.classList.add("active");
    list.appendChild(li);
  });
  document.getElementById("title").textContent="Chapters";
}

// 📖 PAGES
function loadPages(id){
  fetch("https://api.mangadex.org/at-home/server/"+id)
  .then(r=>r.json())
  .then(data=>{
    let base=data.baseUrl;
    let hash=data.chapter.hash;
    pages=data.chapter.data.map(f=>base+"/data/"+hash+"/"+f);
    pageIndex=0;
    mode="reader";
    showPage();
  });
}

function showPage(){
  document.getElementById("list").innerHTML="<img src='"+pages[pageIndex]+"'>";
  document.getElementById("title").textContent="Page "+(pageIndex+1);
  document.getElementById("footer").textContent="↑↓ Pages | 0 Back";
}

// 🎮 KEYS
document.addEventListener("keydown", e=>{

  if(e.key==="2") showFav();
  if(e.key==="8") addFav();

  if(e.key==="5"){
    mode="search";
    document.getElementById("searchBox").style.display="block";
    document.getElementById("searchInput").focus();
    return;
  }

  if(mode==="search"){
    if(e.key==="Enter"){
      let q=document.getElementById("searchInput").value;
      document.getElementById("searchBox").style.display="none";
      searchManga(q);
      mode="list";
    }
    return;
  }

  if(mode==="list"||mode==="chapters"){
    if(e.key==="ArrowDown"){ index=(index+1)%items.length; refresh(); }
    if(e.key==="ArrowUp"){ index=(index-1+items.length)%items.length; refresh(); }
    if(e.key==="Enter"){
      if(mode==="list") loadChapters(items[index].id);
      else loadPages(currentChapters[index].id);
    }
  }

  if(mode==="reader"){
    if(e.key==="ArrowDown" && pageIndex<pages.length-1){ pageIndex++; showPage(); }
    if(e.key==="ArrowUp" && pageIndex>0){ pageIndex--; showPage(); }
  }

  if(e.key==="0"){
    if(mode==="reader"){ mode="chapters"; renderChapters(); }
    else if(mode==="chapters"){ mode="list"; loadHome(); }
  }

});

function renderList(){
  let list=document.getElementById("list");
  list.innerHTML="";
  items.forEach((m,i)=>{
    let li=document.createElement("li");
    li.textContent=m.title;
    if(i===index) li.classList.add("active");
    list.appendChild(li);
  });
}

function refresh(){
  let lis=document.querySelectorAll("li");
  lis.forEach(l=>l.classList.remove("active"));
  if(lis[index]) lis[index].classList.add("active");
}

</script>

</body>
</html>
